[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnprio"
version = "0.1.0"
description = "AI-driven automated web application vulnerability prioritization framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "M. Srikar Bharadwaj" },
    { name = "K. Navneet Sai" },
    { name = "K. Shasanth Reddy" },
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xgboost>=3.0",
    "networkx>=3.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "shap>=0.45",
]

[project.optional-dependencies]
# Model backends. None is required: the default configuration runs the whole pipeline
# offline on the deterministic heuristic backend, with no key and no network.
llm = ["anthropic>=0.40"]
# Free-tier options. Gemini has a free tier and Google Search grounding, which is what the
# exploit-intelligence layer needs. Everything OpenAI-compatible (Groq, OpenRouter, a local
# Ollama) is reached over plain httpx and needs no extra package at all.
gemini = ["google-genai>=1.0"]
free = ["google-genai>=1.0"]
dev = ["pytest>=8.0"]
# The interactive site. The static export needs none of this: it is one HTML file plus a
# data document and opens from disk, which is what keeps the offline claim true.
# fastapi <0.135 pins starlette <0.38, which sse-starlette's current release conflicts
# with. 0.135 is the first version that satisfies both, and pydantic stays at 2.x because
# the frozen core models are built on it.
web = [
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
]

[project.scripts]
vulnprio = "vulnprio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The trained ranker ships with the code. Without it an install has no model to score
# a single-scan run with, and the ranking silently degrades to expected-loss ordering.
vulnprio = ["py.typed", "rank/models/*.ubj", "rank/models/*.meta.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (full pipeline, ablation)",
    "live: requires network or an API key; deselected by default",
    "adversarial: prompt-injection / rank-manipulation corpus tests",
    "property: invariant / property-based tests",
]
filterwarnings = ["ignore::DeprecationWarning"]
