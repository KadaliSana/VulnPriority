# Prior work, as structured data.
#
# Every entry is one study reviewed in the literature review *AI-Driven Automated Web
# Application Vulnerability Prioritization* (Table 1, "Existing methodologies in the reviewed
# corpus"). Authors, year, venue, dataset, headline result and limitation are taken from the
# review's own tables and prose. Nothing here is invented: where the review does not state
# something, the field says so or the capability is coded `unknown`.
#
# CAPABILITY CODING
#   has      the study satisfies the dimension's test as stated in capabilities.py
#   partial  it satisfies part of the test, or satisfies it in a weaker form the review names
#   lacks    the review gives positive evidence that the approach does not do this
#   unknown  the review does not say. NOT evidence of absence; it weakens novelty claims.
#
# The coder is the framework's own author, working from a secondary source. That is a real
# threat to every conclusion drawn from this file and it is recorded in `caveats` below rather
# than left implicit.
#
# Reference numbers in square brackets are the review's own bibliography numbering.

version: 1
review_title: AI-Driven Automated Web Application Vulnerability Prioritization
review_corpus_note: >-
  The reviewed corpus is Table 1 of the review: 45 distinct studies. Forty-three of them are
  references [25]-[67]; the remaining two, Spring et al. [6] and Hore et al. [15], are cited
  earlier in the review but appear in Table 1 as reviewed studies. Table 1's per-paradigm
  counts sum to 46 because Sheng et al. [50] is counted twice, under deep learning and again
  under systematic surveys. References [1]-[24] other than [6] and [15] are standards,
  tools and background citations, not reviewed studies, and are deliberately absent here.

# Corpus-level threats to any conclusion drawn from this file. analysis.py surfaces these
# verbatim in `threats_to_novelty`; they are data, not narrative decoration.
caveats:
  - id: corpus_boundary
    text: >-
      "No prior study does X" here means "no study among these 45 does X". It is a claim about
      one literature review's corpus, not about the literature. A reviewer who knows a
      counterexample outside this corpus refutes the claim without contradicting this file.
  - id: secondary_evidence
    text: >-
      Capability codings are derived from the review's summaries and comparison tables, not from
      reading the 45 primary papers. A study may implement a capability the review does not
      mention. Every `unknown` cell is a possible counterexample, which is why unknown counts
      are reported next to every claim.
  - id: commercial_systems_unassessed
    text: >-
      Commercial and public prioritization systems named in the review's background section but
      not reviewed as studies - Tenable VPR, Qualys TruRisk, CISA SSVC, CISA Vulnrichment, EPSS
      itself, DefectDojo - are not in this corpus. The review states that the commercial
      scoring methodologies are proprietary, so they cannot be coded either way. Several of
      them plausibly implement exploitation grounding and asset context at least as well as
      anything here.
  - id: injection_defence_is_borrowed
    text: >-
      The two dimensions on which this framework is unprecedented in this corpus - untrusted
      evidence containment and adversarial robustness of the prioritizer - rest on mechanisms
      from the LLM-security literature the proposal itself cites: Greshake et al. on indirect
      prompt injection [22], OWASP LLM01:2025 [23], NIST AI 100-2e2025 [24]. Applying them to a
      vulnerability prioritizer and measuring the result is new here; the mechanisms are not.
  - id: robustness_outside_corpus
    text: >-
      Le et al. [67] report that 3 of the 84 studies in their survey tested adversarial
      robustness. Those three are not in this corpus and were not examined. The robustness
      novelty claim is bounded by that fact.
  - id: dimensions_chosen_by_the_authors
    text: >-
      The 23 comparison dimensions were chosen by the framework's authors after the framework
      was designed. A dimension set chosen that way favours the system it describes. Dimensions
      on which this framework would score badly - cost of operation, analyst acceptance,
      detection coverage, deployment maturity, peer review - are absent.
  - id: no_real_deployment
    text: >-
      Every evidence pointer for this framework is a unit test over fixtures or synthetic data.
      No number in this analysis comes from a real scan history, and the combination of
      capabilities claimed as novel has never been run against a real deployment.

