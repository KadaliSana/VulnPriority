  - key: tita2026
    authors: "Tita, Coratu, Cujba & Tapus"
    year: 2026
    venue: Future Internet
    reference: "[66]"
    paradigm: graph
    description: >-
      Constructs attack graphs automatically from Infrastructure-as-Code files and ranks
      vulnerabilities by Kirchhoff effective resistance with EPSS-weighted edge conductances.
    dataset: nine topologies containing 895 version-relevant vulnerability nodes
    headline_result: >-
      Graph-aware prioritization reduced structural risk 4.4-fold over EPSS-only ranking after
      ten patches, and on four of eight heterogeneous topologies EPSS-only prioritization
      produced no structural improvement at all; Monte Carlo simulation drove simulated attack
      success from 3.4% to 0.0% after three patches against 1.9% for EPSS-only; version-aware
      CVE filtering removed 75-97% of version-irrelevant candidates and improved ranking
      effectiveness a further two- to four-fold.
    limitation: >-
      Undirected relaxation loses attack directionality; author-constructed topologies.
