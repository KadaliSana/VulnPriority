    caveats:
      - dimension: monotonicity_under_patching
        note: >-
          The only study in the corpus that states and argues the monotonicity guarantee, and it
          makes the same argument this framework makes - that Bayesian attack-graph propagation
          does not provide it. This framework's contribution is a different route to the same
          property (maximum-probability paths rather than effective resistance) that keeps
          directionality, which effective resistance discards.
      - dimension: applicability_version_reasoning
        note: >-
          The only study in the corpus with version-aware filtering, and it reports a larger
          effect (two- to four-fold) than most modelling choices in the literature. Prior art for
          Research Goal 3.
      - dimension: multi_hop_directed_chain
        note: >-
          Coded partial on the review's own limitation: the undirected relaxation loses attack
          directionality. This is the specific weakness this framework's directed formulation
          addresses.

