# vulnpriority adversarial corpus, version v1 (DESIGN.md 3.10, ADR-002 action item 3).
#
# Every entry validates as a `vulnpriority.core.models.AdversarialCase`. The corpus is the
# measurement instrument for Gap 4's robustness half: the review found that only three of
# eighty-four surveyed studies tested adversarial robustness at all, so "the sandbox works"
# has to be a number that can regress, not a claim.
#
# Reading the fields:
#   case_id         unique, stable; referenced by reports and by KNOWN_PATTERN_GAPS
#   category        an InjectionCategory; benign_control marks the negative class
#   injection_point Provenance of the surface the payload is placed on:
#                     reference_page   -> a ReferenceDoc body      (tier 3)
#                     target_response  -> an Endpoint response sample (tier 4)
#                     scanner_output   -> a Finding description    (tier 2)
#                     exploit_db       -> an ExploitEvidence title (tier 1 - see NOTE below)
#   payload         the literal text an attacker controls
#   goal            inflate | deflate | exfiltrate | none
#   expectation     the bound the framework must hold the payload inside
#
# NOTE on exploit_db: `PROVENANCE_TIER` maps Provenance.EXPLOIT_DB to TrustTier.CURATED_FEED,
# whose influence budget is unrestricted. An Exploit-DB *title* is third-party prose, not a
# curated fact, so these cases deliberately probe a surface whose tier is more generous than
# its trustworthiness. Their expectations are the same as any other case's.
#
# `must_be_detected: true` means `Sandbox.sanitize` is expected to raise at least one
# InjectionSignal on this payload, by any of its three channels: a pattern hit on the
# normalised text, a pattern hit on the raw text that normalisation would have destroyed, or a
# synthetic `nz_*` signal for content normalisation removed (a hidden element, an HTML comment,
# zero-width characters, folded homoglyphs, an elided blob).
#
# Cases marked false are honest-looking lies with no imperative to match - the residual risk
# ADR-002 says influence budgets, not filters, must bound - and are recorded in
# `vulnpriority.adversarial.corpus.KNOWN_PATTERN_GAPS`.

version: v1
name: vulnpriority-adversarial-corpus
updated: '2024-06-01'
description: >-
  Prompt-injection and rank-manipulation corpus: instruction override, role hijack, schema
  smuggling, canary exfiltration, encoded payloads, hidden text, multilingual variants
  (ru, zh, es, de, ar), fabricated inflation and deflation evidence, numeric overflow and
  delimiter escape, plus benign advisory prose and HTTP bodies as the negative class.

