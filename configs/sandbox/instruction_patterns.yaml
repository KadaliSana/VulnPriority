  - id: ml_de_reveal_prompt

    category: multilingual

    regex: '\b(?:zeige|wiederhole|gib|nenne)\s+(?:mir\s+)?(?:deine[nr]?|ihre[nr]?)\s+(?:system[\-\s]?prompt|systemanweisungen|urspr[uü]nglichen\s+anweisungen)'

