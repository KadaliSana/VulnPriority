  - id: ml_de_set_max

    category: multilingual

    regex: '\b(?:setze|stufe|bewerte)\s+(?:die\s+|das\s+|es\s+)?(?:bewertung|priorit[aä]t|kritikalit[aä]t|risiko)?\s*(?:auf|als)\s+(?:maximal|h[oö]chste|kritisch|10)'

