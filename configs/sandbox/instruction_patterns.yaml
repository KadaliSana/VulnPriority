  - id: ml_de_ignore

    category: multilingual

    regex: '\bignorier(?:e|en)\s+(?:sie\s+)?(?:alle\s+)?(?:vorherigen|obigen|bisherigen|vorangegangenen)\s+(?:anweisungen|befehle|anleitungen|regeln)'

    description: German "ignore all previous instructions".



  - id: ml_de_you_are_now

