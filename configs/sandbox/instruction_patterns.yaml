  - id: ml_es_reveal_prompt

    category: multilingual

    regex: '\b(?:muestra|repite|imprime|revela)\s+(?:tu\s+|el\s+)?(?:mensaje\s+del\s+sistema|indicaciones\s+del\s+sistema|prompt\s+del\s+sistema|instrucciones\s+originales)'

